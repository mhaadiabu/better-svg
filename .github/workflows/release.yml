name: Release

on:
  push:
    tags: ["@mhaadi/svg@*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Verify release version and prepare notes
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const { name, version } = JSON.parse(readFileSync('packages/svg/package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (name !== '@mhaadi/svg' || tag !== `${name}@${version}`) {
            throw new Error(`Release tag must match @mhaadi/svg@${version}`);
          }

          const lines = readFileSync('packages/svg/CHANGELOG.md', 'utf8').split('\n');
          const start = lines.indexOf(`## ${version}`);
          if (start === -1) throw new Error(`Missing changelog entry for ${version}`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          let notes = lines.slice(start + 1, next === -1 ? undefined : next).join('\n').trim();
          if (!/^### (Added|Changed|Fixed|Removed|Security)$/m.test(notes) || !/^- /m.test(notes)) {
            throw new Error('Release notes need a change section and at least one entry');
          }

          const previous = execFileSync('git', [
            'describe', '--tags', '--abbrev=0', '--match', '@mhaadi/svg@*', '--match', 'v*',
            `${process.env.GITHUB_SHA}^`,
          ], { encoding: 'utf8' }).trim();
          notes += `\n\n**Full Changelog**: https://github.com/${process.env.GITHUB_REPOSITORY}/compare/${previous}...${tag}\n`;
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), notes);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm --filter @mhaadi/svg build
      - name: Publish to npm
        working-directory: packages/svg
        run: npm publish --access public --provenance --tag "${{ contains(github.ref_name, '-') && 'next' || 'latest' }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
